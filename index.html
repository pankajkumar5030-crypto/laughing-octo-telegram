<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>King of World : Ashish</title>
<style>html,body{margin:0;overflow:hidden;background:#17251b}canvas{width:100vw;height:100vh;display:block}#hud{position:fixed;top:8px;left:10px;color:white;font:bold 16px Arial;text-shadow:2px 2px #000}</style></head><body>
<canvas id=c></canvas><div id=hud>👑 KING OF WORLD : ASHISH<br>❤️100 | 👥8 | 🔫30</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H;function rs(){W=innerWidth;H=innerHeight;c.width=W;c.height=H}rs();onresize=rs;
let p={x:W/2,y:H/2,h:100,a:0,ammo:30},e=[],b=[],over=0;for(let i=0;i<8;i++)e.push({x:30+Math.random()*(W-60),y:40+Math.random()*(H-80),h:40});
let k={};onkeydown=a=>k[a.key.toLowerCase()]=1;onkeyup=a=>k[a.key.toLowerCase()]=0;
function fire(){if(over||p.ammo<1)return;p.ammo--;let q=e.filter(v=>v.h>0).sort((a,b)=>(a.x-p.x)**2+(a.y-p.y)**2-(b.x-p.x)**2-(b.y-p.y)**2)[0];if(!q)return;let dx=q.x-p.x,dy=q.y-p.y,n=Math.hypot(dx,dy)||1;b.push({x:p.x,y:p.y,vx:dx/n*12,vy:dy/n*12})}
ontouchstart=a=>{if(a.touches.length){let t=a.touches[0];if(t.clientX>W*.72)fire();else {p.tx=t.clientX;p.ty=t.clientY}}};
function loop(){if(!over){let dx=(k.d||k.arrowright?1:0)-(k.a||k.arrowleft?1:0),dy=(k.s||k.arrowdown?1:0)-(k.w||k.arrowup?1:0);let n=Math.hypot(dx,dy)||1;p.x=Math.max(15,Math.min(W-15,p.x+dx/n*4));p.y=Math.max(15,Math.min(H-15,p.y+dy/n*4));for(let q of e)if(q.h>0){let dx=p.x-q.x,dy=p.y-q.y,n=Math.hypot(dx,dy)||1;if(n>25){q.x+=dx/n*.3;q.y+=dy/n*.3}else p.h-=.04}for(let z of b){z.x+=z.vx;z.y+=z.vy;for(let q of e)if(q.h>0&&Math.hypot(z.x-q.x,z.y-q.y)<18){q.h-=20;z.dead=1}}b=b.filter(z=>!z.dead&&z.x>0&&z.x<W&&z.y>0&&z.y<H);if(p.h<=0)over=1;if(e.every(q=>q.h<=0))over=2}
x.fillStyle='#29452f';x.fillRect(0,0,W,H);x.strokeStyle='#416447';for(let i=0;i<W;i+=50){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let i=0;i<H;i+=50){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}for(let z of b){x.fillStyle='#ffd34d';x.beginPath();x.arc(z.x,z.y,4,0,7);x.fill()}for(let q of e)if(q.h>0){x.fillStyle='#e34b4b';x.beginPath();x.arc(q.x,q.y,15,0,7);x.fill()}x.fillStyle='#399cff';x.beginPath();x.arc(p.x,p.y,17,0,7);x.fill();document.getElementById('hud').innerHTML=over?(over==2?'🏆 YOU WIN!':'💀 GAME OVER')+'<br>Restart app to play again':`👑 KING OF WORLD : ASHISH<br>❤️${Math.max(0,p.h|0)} | 👥${e.filter(q=>q.h>0).length} | 🔫${p.ammo}<br><small>WASD/Arrow = Move • Tap right side = Fire</small>`;requestAnimationFrame(loop)}requestAnimationFrame(loop)
</script></body></html>
